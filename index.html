<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="https://github.githubassets.com/favicon.ico" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <header>
      <div class="header-inner">
        <div class="header-top">
          <button class="settings-btn" onclick="toggleSettings()">&#9881;&#65039;</button>
        </div>
        <h1><span data-i18n="headerText">CONV</span><span class="accent" data-i18n="headerAccent">ERT</span></h1>
        <p class="tagline" data-i18n="tagline">Currency &amp; Units</p>
        <div class="settings-popup" id="settings-popup">
          <div class="settings-item">
            <span class="settings-icon">&#127760;</span>
            <span data-i18n="settingsLanguage">Language</span>
            <select id="lang-select" onchange="applyLanguage(this.value)">
              <option value="en">English</option>
              <option value="zh">&#20013;&#25991;</option>
              <option value="ar">&#1575;&#1604;&#1593;&#1585;&#1576;&#1610;&#1577;</option>
            </select>
          </div>
        </div>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="currency" onclick="switchTab('currency')" data-i18n="tabCurrency">💱 Currency</button>
      <button class="tab" data-tab="unit" onclick="switchTab('unit')" data-i18n="tabUnits">📐 Units</button>
    </div>

    <!-- CURRENCY VIEW -->
    <div id="currency-view" class="view active">
      <div class="card">
        <div class="converter-layout">
          <div class="conv-section">
            <div class="field-group">
              <label data-i18n="labelAmount">Amount</label>
              <select id="c-from" onchange="convertCurrency()"></select>
              <input type="number" id="c-amount" value="1" oninput="convertCurrency()" placeholder="0" />
            </div>
          </div>

          <button class="swap-btn" onclick="swapCurrency()" title="Swap currencies" data-i18n-title="swapCurrencies">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 7H4m0 0l4-4m-4 4l4 4"/><path d="M8 17h12m0 0l-4-4m4 4l-4 4"/>
            </svg>
          </button>

          <div class="conv-section">
            <div class="field-group">
              <label data-i18n="labelTo">To</label>
              <select id="c-to" onchange="convertCurrency()"></select>
              <div class="result-box">
                <div class="result-num" id="c-result">—</div>
              </div>
            </div>
          </div>
        </div>

        <div class="status" id="c-status">Fetching live rates…</div>
      </div>
    </div>

    <!-- UNIT VIEW -->
    <div id="unit-view" class="view">
      <div class="card">
        <div class="cat-row" id="cat-row"></div>

        <div class="converter-layout">
          <div class="conv-section">
            <div class="field-group">
              <label data-i18n="labelAmount">Amount</label>
              <select id="u-from" onchange="convertUnit()"></select>
              <input type="number" id="u-amount" value="1" oninput="convertUnit()" placeholder="0" />
            </div>
          </div>

          <button class="swap-btn" onclick="swapUnit()" title="Swap units" data-i18n-title="swapUnits">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 7H4m0 0l4-4m-4 4l4 4"/><path d="M8 17h12m0 0l-4-4m4 4l-4 4"/>
            </svg>
          </button>

          <div class="conv-section">
            <div class="field-group">
              <label data-i18n="labelTo">To</label>
              <select id="u-to" onchange="convertUnit()"></select>
              <div class="result-box">
                <div class="result-num" id="u-result">—</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
