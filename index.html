<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <header>
      <h1>CONV<span>ERT</span></h1>
      <p class="tagline">Currency &amp; Units</p>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="currency" onclick="switchTab('currency')">💱 Currency</button>
      <button class="tab" data-tab="unit" onclick="switchTab('unit')">📐 Units</button>
    </div>

    <!-- CURRENCY VIEW -->
    <div id="currency-view" class="view active">
      <div class="card">
        <div class="field-group">
          <label>Amount</label>
          <div class="row">
            <input type="number" id="c-amount" value="1" oninput="convertCurrency()" placeholder="0" />
            <select id="c-from" onchange="convertCurrency()"></select>
          </div>
        </div>

        <button class="swap-btn" onclick="swapCurrency()" title="Swap currencies">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16V4m0 0L3 8m4-4l4 4"/><path d="M17 8v12m0 0l4-4m-4 4l-4-4"/>
          </svg>
        </button>

        <div class="field-group">
          <label>To</label>
          <div class="row">
            <select id="c-to" onchange="convertCurrency()"></select>
          </div>
        </div>

        <div class="result-box">
          <div class="result-num" id="c-result">—</div>
          <div class="result-label" id="c-result-label">Select currencies</div>
        </div>

        <div class="status" id="c-status">Fetching live rates…</div>
      </div>
    </div>

    <!-- UNIT VIEW -->
    <div id="unit-view" class="view">
      <div class="card">
        <div class="cat-row" id="cat-row"></div>

        <div class="field-group">
          <label>Amount</label>
          <div class="row">
            <input type="number" id="u-amount" value="1" oninput="convertUnit()" placeholder="0" />
            <select id="u-from" onchange="convertUnit()"></select>
          </div>
        </div>

        <button class="swap-btn" onclick="swapUnit()" title="Swap units">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16V4m0 0L3 8m4-4l4 4"/><path d="M17 8v12m0 0l4-4m-4 4l-4-4"/>
          </svg>
        </button>

        <div class="field-group">
          <label>To</label>
          <div class="row">
            <select id="u-to" onchange="convertUnit()"></select>
          </div>
        </div>

        <div class="result-box">
          <div class="result-num" id="u-result">—</div>
          <div class="result-label" id="u-result-label">Select units</div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
